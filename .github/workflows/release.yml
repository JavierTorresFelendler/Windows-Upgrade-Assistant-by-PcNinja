name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Resolve and verify release identity
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          & ./.github/scripts/Resolve-ReleaseIdentity.ps1

      - name: Offline app-update release-contract fixtures (no network or publication)
        shell: pwsh
        run: ./tests/Verify-AppUpdatePackaging.ps1

      - name: Run Core smoke tests
        shell: pwsh
        run: |
          dotnet run --project tests/PcNinja.Win11Upgrade.SmokeTests/PcNinja.Win11Upgrade.SmokeTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build GUI checks and run on supported Windows clients
        shell: pwsh
        run: |
          dotnet build tests/PcNinja.Win11Upgrade.GuiChecks/PcNinja.Win11Upgrade.GuiChecks.csproj -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-CimInstance Win32_OperatingSystem).ProductType -eq 1) {
            dotnet run --no-build --project tests/PcNinja.Win11Upgrade.GuiChecks/PcNinja.Win11Upgrade.GuiChecks.csproj -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Output 'Hosted Windows Server: GUI checks compile here; run client interaction checks locally on Windows 10/11.'
          }

      - name: Publish portable EXE
        shell: pwsh
        run: |
          dotnet publish src/PcNinja.Win11UpgradeAssistant/PcNinja.Win11UpgradeAssistant.csproj -c Release -r win-x64 --self-contained true -o artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Headless CLI automation result fixtures (no Setup)
        shell: pwsh
        run: |
          dotnet build tests/PcNinja.Win11Upgrade.CliChecks/PcNinja.Win11Upgrade.CliChecks.csproj -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/PcNinja.Win11Upgrade.CliChecks/PcNinja.Win11Upgrade.CliChecks.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare and verify release assets
        shell: pwsh
        run: |
          & ./.github/scripts/Prepare-ReleaseAssets.ps1 -Commit $env:GITHUB_SHA
          $exe = Join-Path artifacts $env:ASSET_NAME
          & ./tests/Verify-Cli.ps1 -ExePath $exe -ExpectedVersion $env:PRODUCT_VERSION
          Get-Content artifacts/BUILD-INFO.txt | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PcNinja-Win11-Upgrade-Assistant-${{ env.RELEASE_LABEL }}
          if-no-files-found: error
          path: |
            artifacts/${{ env.ASSET_NAME }}
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
            ${{ env.RELEASE_CHANNEL != 'preview' && 'artifacts/update-manifest.json' || '' }}

      - name: Publish verified GitHub release (draft assets first; stable latest last)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: 'true'
        run: ./.github/scripts/Publish-VerifiedRelease.ps1 -Commit $env:GITHUB_SHA
